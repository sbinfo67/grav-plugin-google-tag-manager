name: Google Tag Manager
slug: google-tag-manager
type: plugin
version: 1.0.0
description: Inserts the Google Tag Manager container in every page, at the top of the head with its noscript fallback after the body tag, without touching the theme.
icon: tags
author:
  name: SBINFO
  email: contact@sbinfo.fr
homepage: https://github.com/sbinfo67/grav-plugin-google-tag-manager
keywords: grav, plugin, google tag manager, gtm, analytics, datalayer
bugs: https://github.com/sbinfo67/grav-plugin-google-tag-manager/issues
docs: https://github.com/sbinfo67/grav-plugin-google-tag-manager/blob/main/README.md
license: MIT

# Tested on Grav 1.7.53.4, 2.0.26, 2.1.10 and 2.2.1 (Admin2 2.1.24).
compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    container_id:
      type: text
      label: PLUGIN_GOOGLE_TAG_MANAGER.CONTAINER_ID
      help: PLUGIN_GOOGLE_TAG_MANAGER.CONTAINER_ID_HELP
      description: PLUGIN_GOOGLE_TAG_MANAGER.CONTAINER_ID_DESCRIPTION
      placeholder: GTM-XXXXXXX
      default: ''
      validate:
        max: 30
